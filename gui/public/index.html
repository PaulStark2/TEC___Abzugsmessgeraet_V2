<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zugprüfstand — HMI</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <header class="app-header">
      <h1>Automatisierter 3-Achs-Zugprüfstand</h1>
      <p id="gui-status" class="gui-status">GUI startet…</p>
    </header>

    <div id="status-bar" class="status-bar" aria-label="Maschinenstatus">
      <dl class="status-bar-grid">
        <div>
          <dt>MachineState</dt>
          <dd id="machine-state">—</dd>
        </div>
        <div>
          <dt>MotionState</dt>
          <dd id="motion-state">—</dd>
        </div>
        <div>
          <dt>X</dt>
          <dd id="pos-x">—</dd>
        </div>
        <div>
          <dt>Y</dt>
          <dd id="pos-y">—</dd>
        </div>
        <div>
          <dt>Z</dt>
          <dd id="pos-z">—</dd>
        </div>
        <div>
          <dt>Speed</dt>
          <dd id="manual-speed-display">—</dd>
        </div>
        <div>
          <dt>Spreizer</dt>
          <dd id="pneumatic-state">—</dd>
        </div>
        <div>
          <dt>Homing</dt>
          <dd id="homing-state">—</dd>
        </div>
        <div class="status-bar__force status-bar__force--pending">
          <dt>Fx</dt>
          <dd id="force-fx">—</dd>
        </div>
        <div class="status-bar__force status-bar__force--pending">
          <dt>Fy</dt>
          <dd id="force-fy">—</dd>
        </div>
        <div class="status-bar__force status-bar__force--pending">
          <dt>Fz</dt>
          <dd id="force-fz">—</dd>
        </div>
      </dl>
      <button type="button" id="btn-stop-global" class="btn-stop btn-stop-global">
        STOP
      </button>
    </div>

    <main class="app-layout">
      <div id="page-root" class="page-root" aria-live="polite"></div>

      <aside class="viewport-panel panel panel-viewport" aria-labelledby="viewport-heading">
        <h2 id="viewport-heading">TCP 3D-Ansicht (Core-Pose)</h2>
        <p class="placeholder-note">
          Anzeige 1:1 aus dem Core (Z-up). Keine JS-Kinematik. Orbit: drehen / zoom / pan.
        </p>
        <canvas id="tcp-canvas" class="tcp-canvas" width="640" height="360"></canvas>
        <div class="control-actions">
          <button type="button" id="btn-reset-camera">Kamera zurücksetzen</button>
        </div>
      </aside>
    </main>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
