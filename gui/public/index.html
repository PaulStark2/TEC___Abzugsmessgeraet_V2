<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zugprüfstand — HMI</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Automatisierter 3-Achs-Zugprüfstand</h1>
      <p id="gui-status" class="gui-status">GUI startet…</p>
    </header>

    <main class="app-main">
      <section class="panel" aria-labelledby="status-heading">
        <h2 id="status-heading">Maschinenstatus</h2>
        <dl class="status-grid">
          <div>
            <dt>MachineState</dt>
            <dd id="machine-state">—</dd>
          </div>
          <div>
            <dt>MotionState</dt>
            <dd id="motion-state">—</dd>
          </div>
        </dl>
      </section>

      <section class="panel" aria-labelledby="pose-heading">
        <h2 id="pose-heading">Position</h2>
        <dl class="status-grid">
          <div>
            <dt>X</dt>
            <dd id="pos-x">—</dd>
          </div>
          <div>
            <dt>Y</dt>
            <dd id="pos-y">—</dd>
          </div>
          <div>
            <dt>Z</dt>
            <dd id="pos-z">—</dd>
          </div>
        </dl>
      </section>

      <section class="panel" aria-labelledby="controls-heading">
        <h2 id="controls-heading">Steuerung</h2>
        <p class="placeholder-note">
          Soft-STOP (kein Hardware-E-Stop). Commands gehen an den Server-Mock.
        </p>
        <form id="move-form" class="control-form">
          <label>
            Ziel X
            <input id="target-x" name="x" type="number" step="any" value="10" required />
          </label>
          <label>
            Ziel Y
            <input id="target-y" name="y" type="number" step="any" value="20" required />
          </label>
          <label>
            Ziel Z
            <input id="target-z" name="z" type="number" step="any" value="30" required />
          </label>
          <button type="submit" id="btn-moveto">Move To</button>
        </form>
        <div class="control-actions">
          <button type="button" id="btn-pause">Pause</button>
          <button type="button" id="btn-resume">Resume</button>
          <button type="button" id="btn-stop" class="btn-stop">STOP</button>
        </div>
        <p id="command-feedback" class="command-feedback" aria-live="polite"></p>
      </section>
    </main>

    <script src="/js/app.js"></script>
  </body>
</html>
